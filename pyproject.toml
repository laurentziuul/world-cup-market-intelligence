[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-cup-market-intelligence"
version = "0.1.0"
description = "Open-source market intelligence framework for FIFA World Cup 2026 prediction markets"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Iorgulescu Laurentiu" }]
license = { text = "MIT" }
dependencies = [
  "requests>=2.31.0",
  "pandas>=2.0.0",
  "python-dotenv>=1.0.0",
  "jinja2>=3.1.0",
  "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
